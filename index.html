<!DOCTYPE html>
<html lang="vi">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SƠN PREMIUM ORDER - HOÀN TIỀN</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --shopee-orange: #ff4d24;
      --shopee-orange-hover: #f03e15;
      --shopee-light-orange: #fff5f2;
      --shopee-text: #222222;
      --shopee-gray: #757575;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Be Vietnam Pro', sans-serif;
      background: linear-gradient(180deg, #ffeae5 0%, #f6f6f6 50%, #f0f0f0 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .shopee-card {
      background: #ffffff;
      width: 100%;
      max-width: 500px;
      border-radius: 24px;
      padding: 30px 24px;
      box-shadow: 0 10px 30px rgba(255, 77, 36, 0.05), 0 1px 3px rgba(0,0,0,0.02);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--shopee-text);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-title::before {
      content: '';
      display: inline-block;
      width: 7px;
      height: 7px;
      background-color: var(--shopee-orange);
      border-radius: 50%;
    }

    .header-link {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--shopee-orange);
      text-decoration: none;
    }

    .sale-banner {
      background-color: var(--shopee-light-orange);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      color: #ee4d2d;
      font-weight: 500;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--shopee-text);
      margin-bottom: 6px;
      display: block;
    }

    .input-box-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-box-wrapper i {
      position: absolute;
      left: 14px;
      color: #a0a0a0;
      font-size: 0.95rem;
    }

    .input-control {
      width: 100%;
      padding: 13px 14px 13px 40px;
      font-size: 0.9rem;
      border: 1px solid #e0e0e0;
      border-radius: 12px;
      background-color: #fafafa;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }

    .input-control:focus {
      border-color: var(--shopee-orange);
      background-color: #fff;
      box-shadow: 0 0 0 3px rgba(255, 77, 36, 0.08);
    }

    .btn-convert {
      width: 100%;
      padding: 14px;
      background-color: #ffc4b6;
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      margin-top: 20px;
    }

    .btn-convert.ready {
      background-color: var(--shopee-orange);
    }
    .btn-convert.ready:hover {
      background-color: var(--shopee-orange-hover);
    }

    .inline-notice {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 0.84rem;
      line-height: 1.55;
      white-space: pre-line;
      display: none;
    }

    .inline-notice.warn {
      background-color: #fff7e6;
      border: 1px solid #ffd591;
      color: #873800;
      display: block;
    }

    .inline-notice.error {
      background-color: #fff1f0;
      border: 1px solid #ffa39e;
      color: #a8071a;
      display: block;
    }

    .inline-notice.success {
      background-color: #f6ffed;
      border: 1px solid #b7eb8f;
      color: #135200;
      display: block;
    }

    .result-section {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px dashed #e8e8e8;
      display: none;
    }

    .result-box {
      width: 100%;
      padding: 12px;
      background: #f8f9fa;
      border: 1px solid #eee;
      border-radius: 10px;
      font-size: 0.85rem;
      font-family: inherit;
      line-height: 1.5;
      color: #333;
      resize: none;
      margin-bottom: 12px;
      outline: none;
    }

    .action-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .btn-copy {
      width: 100%;
      padding: 13px;
      background-color: #ffffff;
      color: #222;
      border: 1px solid #d9d9d9;
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .btn-copy:hover { background-color: #f5f5f5; }

    .btn-buy {
      width: 100%;
      padding: 13px;
      background-color: #222;
      color: white;
      border: none;
      border-radius: 14px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }
    .btn-buy:hover { background-color: #444; }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 16px;
      font-size: 0.75rem;
      color: var(--shopee-gray);
    }

    .footer-secure {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .footer-help {
      color: var(--shopee-orange);
      text-decoration: none;
      font-weight: 500;
    }

    .loader {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="shopee-card">
    <div class="card-header">
      <div class="card-title">Sắp tới: Siêu Sale SPO</div>
      <a href="https://zalo.me/0859247406" target="_blank" class="header-link">Hỗ trợ <i class="fa-solid fa-chevron-right" style="font-size: 10px;"></i></a>
    </div>

    <div class="sale-banner">
      <i class="fa-solid fa-fire"></i>
      <span>Đang có <b style="font-weight: 700;">24</b> người đang mua sắm hoàn tiền — Đừng bỏ lỡ!</span>
    </div>

    <div class="input-group">
      <label class="input-label" for="username">Tên đăng nhập hệ thống</label>
      <div class="input-box-wrapper">
        <i class="fa-regular fa-user"></i>
        <input type="text" id="username" class="input-control" placeholder="Nhập ID / Tên tài khoản của bạn" oninput="checkInputs()">
      </div>
    </div>

    <div class="input-group">
      <label class="input-label" for="inputLink">Liên kết Shopee / Lazada / TikTok</label>
      <div class="input-box-wrapper">
        <i class="fa-solid fa-link"></i>
        <input type="text" id="inputLink" class="input-control" placeholder="Dán link Shopee, Lazada hoặc TikTok..." oninput="checkInputs()">
      </div>
    </div>

    <button class="btn-convert" id="generateButton" onclick="generateLink()">
      <i class="fa-solid fa-arrows-rotate"></i> CHUYỂN ĐỔI LINK <i class="fa-solid fa-arrow-right" style="font-size: 11px;"></i>
    </button>

    <div id="inlineNotice" class="inline-notice"></div>

    <div class="result-section" id="resultArea">
      <label class="input-label">Link hoàn tiền:</label>
      <textarea id="resultOutput" class="result-box" rows="2" readonly></textarea>

      <div class="action-group">
        <button class="btn-copy" onclick="copyResultText()">
          <i class="fa-regular fa-copy"></i> SAO CHÉP
        </button>
        <button class="btn-buy" onclick="buyNow()">
          <i class="fa-solid fa-cart-shopping"></i> MUA NGAY
        </button>
      </div>
    </div>

    <div class="card-footer">
      <div class="footer-secure">
        <i class="fa-regular fa-circle-check" style="color: #52c41a;"></i> An toàn — Nhanh chóng — Chính xác
      </div>
      <a href="#" class="footer-help">Hướng dẫn</a>
    </div>
  </div>

  <script>
    let realAffiliateLink = "";

    const NO_COMMISSION_MSG =
      "⚠️ Sản phẩm này không nằm trong chương trình hoa hồng nên bot không tạo link hoàn tiền được ạ ❤️\n" +
      "Bạn vẫn mua bình thường được nhưng sẽ KHÔNG có tiền hoàn. Muốn được hoàn tiền thì chọn sản phẩm khác rồi gửi link lại giúp mình nha.";

    function setNotice(message, type = "warn") {
      const el = document.getElementById("inlineNotice");
      if (!message) {
        el.className = "inline-notice";
        el.textContent = "";
        return;
      }
      el.className = "inline-notice " + type;
      el.textContent = message;
    }

    function detectPlatform(url) {
      const value = String(url || "").toLowerCase();
      if (/(^|[/:.])((www|m)\.)?lazada\.(vn|sg|co\.th|com\.my|com\.ph|co\.id)(\/|$)/i.test(value) ||
          /s\.lazada\.vn|c\.lazada\.vn|lzd\.co/.test(value)) return "Lazada";
      if (/shopee\.(vn|sg|com\.my|co\.th|ph|co\.id)|shp\.ee|vn\.shp\.ee/.test(value)) return "Shopee";
      if (/(^|[/:.])((www|m|shop|vm|vt)\.)?tiktok\.com(\/|$)/i.test(value)) return "TikTok";
      return "";
    }

    function isNoCommissionLink(url) {
      return /(^|[/:.])shp\.today(\/|$)/i.test(String(url || "").trim());
    }

    function extractUrlFromPayload(payload) {
      if (!payload || typeof payload !== "object") return "";
      const candidates = [
        payload.result,
        payload.url,
        payload.link,
        payload.data && payload.data.result,
        payload.data && payload.data.url,
        payload.data && payload.data.link
      ];
      for (let i = 0; i < candidates.length; i++) {
        const val = String(candidates[i] || "").trim();
        if (/^https?:\/\//i.test(val)) return val;
      }
      return "";
    }

    function checkInputs() {
      const username = document.getElementById("username").value.trim();
      const inputLink = document.getElementById("inputLink").value.trim();
      const btn = document.getElementById("generateButton");
      btn.classList.toggle("ready", !!(username && inputLink));
    }

    function handleConvertedLink(link, platformLabel) {
      const cleanLink = String(link || "").trim();
      if (!cleanLink || isNoCommissionLink(cleanLink)) {
        setNotice(NO_COMMISSION_MSG, "warn");
        return;
      }

      setNotice("", "");
      realAffiliateLink = cleanLink;
      document.getElementById("resultOutput").value = realAffiliateLink;
      document.querySelector(".btn-buy").innerHTML =
        '<i class="fa-solid fa-cart-shopping"></i> MUA NGAY TRÊN ' + platformLabel.toUpperCase();
      document.getElementById("resultArea").style.display = "block";
    }

    function copyResultText() {
      const text = document.getElementById("resultOutput").value;
      if (!text) return;
      navigator.clipboard.writeText(text).then(() => {
        setNotice("✅ Đã sao chép link vào bộ nhớ tạm!", "success");
      });
    }

    async function generateLink() {
      const input = document.getElementById("inputLink").value.trim();
      const username = document.getElementById("username").value.trim();
      const btn = document.getElementById("generateButton");
      const resultArea = document.getElementById("resultArea");

      setNotice("", "");
      resultArea.style.display = "none";
      realAffiliateLink = "";

      if (!input || !username) {
        setNotice("⚠️ Vui lòng điền tên đăng nhập và dán link Shopee, Lazada hoặc TikTok!", "warn");
        return;
      }

      const platform = detectPlatform(input);
      if (!platform) {
        setNotice("⚠️ Không nhận diện được link. Vui lòng kiểm tra đây có phải link Shopee, Lazada hoặc TikTok không.", "warn");
        return;
      }

      btn.disabled = true;
      const originalText = btn.innerHTML;
      btn.innerHTML = '<span class="loader"></span> ĐANG XỬ LÝ...';

      if (typeof google !== "undefined" && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler((res) => {
            btn.innerHTML = originalText;
            btn.disabled = false;

            if (!res) {
              setNotice("❌ Phản hồi máy chủ rỗng.", "error");
              return;
            }
            if (typeof res === "string") {
              if (res.startsWith("⚠️")) {
                setNotice(res, "warn");
                return;
              }
              if (res.startsWith("❌")) {
                setNotice(res, "error");
                return;
              }
              handleConvertedLink(res, platform);
              return;
            }

            const convertedUrl = extractUrlFromPayload(res);
            const isOk = typeof res.ok === "boolean" ? res.ok : Boolean(convertedUrl);
            if (!isOk || !convertedUrl) {
              const errMsg = res.error || res.message || NO_COMMISSION_MSG;
              setNotice(errMsg, String(errMsg).startsWith("⚠️") ? "warn" : "error");
              return;
            }

            const rawPlatform = String(res.platform || "").toLowerCase();
            const label = rawPlatform === "tiktok" ? "TikTok"
              : rawPlatform === "lazada" ? "Lazada"
              : rawPlatform === "shopee" ? "Shopee"
              : platform;
            handleConvertedLink(convertedUrl, label);
          })
          .withFailureHandler((err) => {
            btn.innerHTML = originalText;
            btn.disabled = false;
            setNotice("❌ Lỗi kết nối máy chủ Apps Script: " + (err && err.message ? err.message : ""), "error");
          })
          .CONVERT_LINK_DETAIL(username, input);
        return;
      }

      try {
        const res = await fetch("/api/convert", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, url: input })
        });
        const data = await res.json();
        btn.innerHTML = originalText;
        btn.disabled = false;

        const convertedUrl = extractUrlFromPayload(data);
        const isOk = res.ok && (typeof data.success === "boolean" ? data.success : Boolean(convertedUrl));
        if (!isOk || !convertedUrl) {
          const errMsg = data.error || data.message || NO_COMMISSION_MSG;
          setNotice(errMsg, String(errMsg).startsWith("⚠️") ? "warn" : "error");
          return;
        }

        const rawPlatform = String(data.platform || "").toLowerCase();
        const label = rawPlatform === "tiktok" ? "TikTok"
          : rawPlatform === "lazada" ? "Lazada"
          : rawPlatform === "shopee" ? "Shopee"
          : platform;
        handleConvertedLink(convertedUrl, label);
      } catch (err) {
        btn.innerHTML = originalText;
        btn.disabled = false;
        setNotice("❌ Lỗi kết nối máy chủ: " + (err && err.message ? err.message : ""), "error");
      }
    }

    function buyNow() {
      if (!realAffiliateLink) {
        setNotice("⚠️ Vui lòng thực hiện chuyển đổi link trước.", "warn");
        return;
      }
      window.open(realAffiliateLink, "_blank", "noopener");
    }
  </script>
</body>
</html>
